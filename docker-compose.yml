version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: simplerag_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simplerag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simplerag_network

  ollama:
    image: ollama/ollama:latest
    container_name: simplerag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - simplerag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    container_name: simplerag_app
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./documents_to_scan:/app/documents_to_scan
      - ./chroma_db:/app/chroma_db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/simplerag
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama2
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - SCAN_DIR=/app/documents_to_scan
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - simplerag_network
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  simplerag_network:
    driver: bridge
